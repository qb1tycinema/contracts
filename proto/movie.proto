syntax = "proto3";

package movie.v1;

import "google/protobuf/timestamp.proto";

service MovieService {
    rpc ListMovies (ListMoviesRequest) returns (ListMoviesResponse);
    rpc GetMovie (GetMovieRequest) returns (GetMovieResponse);
    rpc CreateMovie (CreateMovieRequest) returns (CreateMovieResponse);
}

message ListMoviesRequest {
    string category = 1;
    bool random = 2;
    int32 limit = 3;
}

message ListMoviesResponse {
    repeated Movie movies = 1;
}

message GetMovieRequest {
    oneof key {
        string id = 1;
        string slug = 2;
    }
}

message GetMovieResponse {
    MovieDetails movie = 1;
}

message CreateMovieRequest {
    string title = 1;
    string slug = 2;
    string description = 3;
    string poster = 4;
    optional string banner = 5;
    int32 duration = 6;
    int32 release_year = 7;
    google.protobuf.Timestamp release_date = 8;
    string rating_age = 9;
    repeated string country = 10;
    string category_id = 11;
}

message CreateMovieResponse {
    MovieDetails movie = 1;
}

message Movie {
    string id = 1;
    string title = 2;
    string slug = 3;
    string poster = 4;
    string rating_age = 5;
    google.protobuf.Timestamp release_date = 6;
}

message MovieDetails {
    string id = 1;
    string title = 2;
    string slug = 3;
    string description = 4;
    string poster = 5;
    string banner = 6;
    int32 duration = 7;
    string rating_age = 8;
    string country = 9;
    google.protobuf.Timestamp release_date = 10;
}