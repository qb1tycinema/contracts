syntax = "proto3";

package movie.v1;

import "google/protobuf/timestamp.proto";

service MovieService {
    rpc ListMovies (ListMoviesRequest) returns (ListMoviesResponse);
    rpc GetMovie (GetMovieRequest) returns (GetMovieResponse);
    rpc CreateMovie (CreateMovieRequest) returns (CreateMovieResponse);
}

message ListMoviesRequest {
    string category = 1;
    bool random = 2;
    int32 limit = 3;

    SortOrder sort_order = 4;
    SortBy sort_by = 5;

    YearFilter filter_year = 6;
    DurationFilter filter_duration = 7;
    AgeFilter filter_age = 8;
}

message ListMoviesResponse {
    repeated Movie movies = 1;
}

message GetMovieRequest {
    oneof key {
        string id = 1;
        string slug = 2;
    }
}

message GetMovieResponse {
    MovieDetails movie = 1;
}

message CreateMovieRequest {
    string title = 1;
    string slug = 2;
    string description = 3;
    string poster = 4;
    optional string banner = 5;
    int32 duration = 6;
    int32 release_year = 7;
    google.protobuf.Timestamp release_date = 8;
    string rating_age = 9;
    repeated string country = 10;
    string category_id = 11;
}

message CreateMovieResponse {
    MovieDetails movie = 1;
}

message Movie {
    string id = 1;
    string title = 2;
    string slug = 3;
    string poster = 4;
    string rating_age = 5;
    google.protobuf.Timestamp release_date = 6;
}

message MovieDetails {
    string id = 1;
    string title = 2;
    string slug = 3;
    string description = 4;
    string poster = 5;
    string banner = 6;
    int32 duration = 7;
    string rating_age = 8;
    string country = 9;
    google.protobuf.Timestamp release_date = 10;
}

enum SortOrder {
    SORT_ORDER_DESK = 0;
    SORT_ORDER_ASC = 1;
}

enum SortBy {
    SORT_BY_RELEASE_DATE = 0;
    SORT_BY_RELEASE_YEAR = 1;
}

enum YearFilter {
    YEAR_FILTER_UNSPECIFIED = 0;
    YEAR_FILTER_THIS_YEAR = 1;
    YEAR_FILTER_LAST_YEAR = 2;
    YEAR_FILTER_RETRO = 3;
}

enum DurationFilter {
    DURATION_FILTER_UNSPECIFIED = 0;
    DURATION_FILTER_SHORT = 1;
    DURATION_FILTER_LONG = 2;
}

enum AgeFilter {
    AGE_FILTER_UNSPECIFIED = 0;
    AGE_FILTER_FAMILY = 1;
    AGE_FILTER_ADULT = 2;
}